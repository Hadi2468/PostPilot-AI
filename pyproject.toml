[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "postpilot-ai"
version = "0.1.0"
description = "A self-critiquing, human-in-the-loop LinkedIn post agent built on LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hadi Hosseini" }]
keywords = ["langgraph", "agents", "reflexion", "llm", "human-in-the-loop"]
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "tavily-python>=0.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.29"]
dashboard = ["streamlit>=1.50", "requests>=2.31", "altair>=5", "pandas>=2"]
dev = ["postpilot-ai[api]", "pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
postpilot = "postpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/postpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
